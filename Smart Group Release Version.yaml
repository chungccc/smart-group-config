allow-lan: true
default:
  proxies: &pr01
  - HKG
  - JPN
  - SGP
  - SMART
  - HKT
  - HOME
  - Media Mix
  - HK-Basic
  - SG-Basic
  - Other-Basic
  - Manual Choice
  - Download
  - HKG Fallback
  - 直连
  - 拒绝
  type: select
  
  
# P2P下载端口
listeners:
- name: socks5-in-1
  type: socks
  port: 10808
  listen: 0.0.0.0
  udp: true
  users: []
  proxy: DIRECT

dns:
  enable: true
  #  基础模式 
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  ipv6: true
  listen: 0.0.0.0:7874
  fake-ip-filter:  #  fake-ip 例外（不走 fake-ip，直连真实 IP）
    - +.lan
    - +.local
    - geosite:cn
  nameserver:  #  默认 DNS（国内优先，只放国内）
    - 202.96.134.33
    - 202.96.128.86
    - 223.5.5.5           # 阿里 DNS
    - 119.29.29.29        # 腾讯 DNSPod
    - 1.12.12.12          # 腾讯安全 DNS
  nameserver-policy:  #  规则指定 DNS（与官方示例一致）
    '+.arpa': 192.168.2.1
    'geosite:cn':
      - 223.5.5.5
      - 119.29.29.29
  proxy-server-nameserver:  #代理服务器自身域名解析 机场节点用
    - 223.5.5.5
    - 119.29.29.29
  fallback:  #Overseas / 被污染域名兜底 DNS
    - tls://1.1.1.1:853
    - tls://8.8.8.8:853
    - tls://9.9.9.9:853
  fallback-filter:  #什么时候才启用 fallback
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'
external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
ipv6: true
log-level: info
mixed-port: 7893
mode: rule
port: 7890
profile:
  store-fake-ip: true
  store-selected: true
unified-delay: true # 统一延迟 计算RTT 可选值 true/false
lgbm-auto-update: true #smart模型更新
lgbm-update-interval: 48
lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin"
