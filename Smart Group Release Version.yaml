#ONEsmart
- name: SMART
  type: smart
  filter: ".*PRM.*"
  uselightgbm: true
  collectdata: false
  include-all: true
  policy-priority: "Max:0.5;TOP:0.5;"
  prefer-asn: true
#香港地区
- name: HKG
  type: smart
  filter: "(?=.*(香港|HK|Hong Kong|HKG))(?=.*PRM).*"
  uselightgbm: true
  collectdata: false
  include-all: true
  policy-priority: "Max:0.5;TOP:0.3;PRO:0.3;"
  prefer-asn: true

- name: HKT
  type: smart
  filter: "(?=.*(香港|HK|Hong Kong|HKG))(?=.*(?:HKT|HKBN|HOME)).*"
  uselightgbm: true
  collectdata: false
  include-all: true

- name: HKG Manual
  type: select
  include-all: true
  filter: "(?=.*(香港|HK|Hong Kong|HKG))(?=.*(PRM|STB)).*"
  lazy: true
  disable-udp: false
  url: "http://www.gstatic.com/generate_204"
  interval: 300

- name: HKG Fallback
  type: fallback
  proxies:
    - HKG Manual
    - HKG
  url: "http://www.gstatic.com/generate_204"
  interval: 300
  lazy: true
#HOME
- name: HOME
  type: smart
  filter: "(?=.*HOME).*"
  uselightgbm: true
  collectdata: false
  include-all: true

#新加坡地区
- name: SGP
  type: smart
  filter: '^(?=.*(新加坡|SG|Singapore|SGP))(?=.*PRM).*$'
  uselightgbm: true
  collectdata: false
  include-all: true
  policy-priority: "Max:0.5;TOP:0.3;"
  prefer-asn: true

#日本地区
- name: JPN 
  type: smart 
  filter: '^(?=.*(日本|东京|JP|Japan|JPN))(?=.*PRM).*$' 
  uselightgbm: true 
  collectdata: false 
  include-all: true 
  policy-priority: "Max:0.5;TOP:0.3;"
  prefer-asn: true

#新加坡香港BSC混合节点组
- name: HK-Basic #Emby节点
  type: smart
  uselightgbm: true
  collectdata: false
  include-all: true
  filter: "(?=.*(香港|HK|Hong Kong|HKG))(?=.*BSC).*"
  prefer-asn: true

- name: SG-Basic #Emby节点
  type: smart
  uselightgbm: true
  collectdata: false
  include-all: true
  filter: "(?=.*(新加坡|SG|Singapore|SGP))(?=.*BSC).*"
  policy-priority: LXY:1.2
  prefer-asn: true

- name: Other-Basic #Emby节点
  type: smart
  uselightgbm: true
  collectdata: false
  include-all: true
  filter: "(?=.*(TWN|KOR|DEU|FRA|GBR|BRA|NLD))(?=.*BSC).*"
  prefer-asn: true

- name: Emby Manual
  type: select
  include-all: true
  filter: "(?=.*(HKG|SGP|TWN|KOR|DEU|FRA|GBR|BRA|NLD))(?=.*(BSC|STB)).*"
  lazy: true
  disable-udp: false
  url: "http://www.gstatic.com/generate_204"
  interval: 300

- name: Emby Fallback
  type: fallback
  proxies:
    - Emby Manual
    - SG-Basic
    - HK-Basic
    - Other-Basic
  url: "http://www.gstatic.com/generate_204"
  interval: 300
  lazy: true

- name: Media Mix #YouTube节点
  type: smart
  uselightgbm: true
  collectdata: false
  include-all: true
  filter: "(?=.*(香港|HK|Hong Kong|HKG))(?=.*(PRM|PRO|STB))(?!.*(Max|MAX|Top|TOP)).*"
  policy-priority: "PRM:1.3;CT:1.2;BSC:0.5;"
  prefer-asn: true

#其他
- filter: ^((?!(拒绝|直连)).)*$
  include-all: true
  name: Manual Choice
  type: select

- name: Download
  type: smart
  uselightgbm: true
  collectdata: false
  include-all: true
  filter: "(?i)(下载|0\\.1|0\\.01X|BT|DL)"
  prefer-asn: true


