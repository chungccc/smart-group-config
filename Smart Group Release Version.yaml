secret: '123456'
socks-port: 7891
tproxy-port: 7895
tun:
  auto-detect-interface: false
  auto-redirect: false
  auto-route: false
  device: utun
  endpoint-independent-nat: true
  stack: mixed
  strict-route: false

geodata-mode: true
# 设置 GEO 文件加载模式
geodata-loader: standard  # 或者 memconservative（根据内存情况选择）
# 是否启用 GEO 文件自动更新
geo-auto-update: true  # 启用自动更新
# 设置 GEO 文件更新的间隔，单位为小时
geo-update-interval: 24  # 每 24 小时更新一次

geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
