#ONEsmart
- name: SMART
  type: smart
  filter: ".*PRM.*"
  uselightgbm: true
  collectdata: false
  include-all: true
  policy-priority: "PRM:1.3;"
  prefer-asn: true
#香港地区
- name: HKG
  type: smart
  filter: "(?=.*(香港|HK|Hong Kong|HKG)).*"
  uselightgbm: true
  collectdata: false
  include-all: true
  policy-priority: "PRM:1.3;"
  prefer-asn: true
#HOME
- name: HOME
  type: smart
  filter: "(?=.*(HOME|家宽|家庭|住宅)).*"
  uselightgbm: true
  collectdata: false
  include-all: true

#新加坡地区
- name: SGP
  type: smart
  filter: '^(?=.*(新加坡|SG|Singapore|SGP)).*$'
  uselightgbm: true
  collectdata: false
  include-all: true
  policy-priority: "PRM:1.3;"
  prefer-asn: true

#日本地区
- name: JPN 
  type: smart 
  filter: '^(?=.*(日本|东京|JP|Japan|JPN)).*$'
  uselightgbm: true 
  collectdata: false 
  include-all: true 
  policy-priority: "PRM:1.3;"
  prefer-asn: true

#美国地区
- name: USA
  type: smart
  filter: '^(?=.*(美国|纽约|洛杉矶|US|USA|United States|America)).*$'
  uselightgbm: true
  collectdata: false
  include-all: true
  policy-priority: "PRM:1.3;"
  prefer-asn: true


#手动选择
- filter: ^((?!(拒绝|直连)).)*$
  include-all: true
  name: Manual Choice
  type: select

- name: Download
  type: smart
  uselightgbm: true
  collectdata: false
  include-all: true
  filter: "(?i)(下载|0\\.1|0\\.01X|BT|DL)"
  prefer-asn: true


