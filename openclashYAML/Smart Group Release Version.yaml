proxy-providers:
  机场A:
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      lazy: true
      interval: 300
      timeout: 3000
    interval: 3000
    path: ./providers/机场A.yaml
    type: http
    url: #删除本注释并填入订阅链接
    filter: '(香港|日本|新加坡|美国|韩国|台湾|家宽|原生)' #筛选保留节点 也可以替换成下列filter
