         target: "HKG-"
       - pattern: "韩国"
         target: "KOR"
       - pattern: "马来西亚"
         target: "MYS"
       - pattern: "泰国"
         target: "THA"
       - pattern: "首尔"
         target: "Soul"
       - pattern: "新加坡"
         target: "SGP-"
       - pattern: "日本"
         target: "JPN-"
       - pattern: "台湾"
         target: "TWN-"
       - pattern: "加拿大"
         target: "CAN-"
       - pattern: "英国"
         target: "GBR-"
       - pattern: "美国"
         target: "USA-"
       - pattern: "原生"
         target: "-Native"
       - pattern: "家宽"
         target: "HOME"
       - pattern: "联通"
         target: "CU"
