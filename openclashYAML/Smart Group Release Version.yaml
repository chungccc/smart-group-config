allow-lan: true
default:
  proxies: &pr01 [HKG, JPN, SGP, USA, SMART, HOME, Media Mix, HK-Basic, SG-Basic, Other-Basic, Manual Choice, Download, 直连, 拒绝]
  type: select
  
  
# P2P下载端口
listeners:
- name: socks5-in-1
  type: socks
  port: 10808
  listen: 0.0.0.0
  udp: true
  users: []
  proxy: DIRECT

dns:
  enable: true
  #  基础模式 
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  ipv6: true
  listen: 0.0.0.0:7874
  fake-ip-filter:  #  fake-ip 例外（不走 fake-ip，直连真实 IP）
    - +.lan
    - +.local
    - geosite:cn
  nameserver:  #  默认 DNS（国内优先，只放国内）
    - 202.96.134.33
    - 202.96.128.86
    - 223.5.5.5           # 阿里 DNS
    - 119.29.29.29        # 腾讯 DNSPod
    - 1.12.12.12          # 腾讯安全 DNS
  nameserver-policy:  #  规则指定 DNS（与官方示例一致）
    '+.arpa': 192.168.2.1
    'geosite:cn':
      - 223.5.5.5
      - 119.29.29.29
  proxy-server-nameserver:  #代理服务器自身域名解析 机场节点用
    - 223.5.5.5
    - 119.29.29.29
  fallback:  #Overseas / 被污染域名兜底 DNS
    - tls://1.1.1.1:853
    - tls://8.8.8.8:853
    - tls://9.9.9.9:853
  fallback-filter:  #什么时候才启用 fallback
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'
external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
ipv6: true
log-level: info
mixed-port: 7893
mode: rule
port: 7890
profile:
  store-fake-ip: true
  store-selected: true
unified-delay: true # 统一延迟 计算RTT 可选值 true/false
#smart模型更新
lgbm-auto-update: true #smart模型更新
lgbm-update-interval: 48
lgbm-url: "https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin"

proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}
proxy-groups:
  - {name: Test, proxies: *pr01, type: select}
  - {name: Steam, proxies: *pr01, type: select}
  - {name: Game, proxies: *pr01, type: select}
  - {name: YouTube, proxies: *pr01, type: select}
  - {name: TVB, proxies: *pr01, type: select}
  - {name: Instagram, proxies: *pr01, type: select}
  - {name: Telegram, proxies: *pr01, type: select}
  - {name: Google, proxies: *pr01, type: select}
  - {name: Emby, proxies: *pr01, type: select}
  - {name: FavSites, proxies: *pr01, type: select}
  - {name: Pornhub, proxies: *pr01, type: select}
  - {name: TikTok, proxies: *pr01, type: select}
  - {name: ChatGPT, proxies: *pr01, type: select}
  - {name: GitHub, proxies: *pr01, type: select}
  - {name: Twitter, proxies: *pr01, type: select}
  - {name: Facebook, proxies: *pr01, type: select}
  - {name: Netflix, proxies: *pr01, type: select}
  - {name: Spotify, proxies: *pr01, type: select}
  - {name: Apple, proxies: *pr01, type: select}
  - {name: Microsoft, proxies: *pr01, type: select}
  - {name: Overseas, proxies: *pr01, type: select}
  - {name: CHN, proxies: *pr01, type: select}
  - {name: Others, proxies: *pr01, type: select}
  - {name: AdsBlock, type: select, proxies: [拒绝, 直连]}

  # ONEsmart
  - {name: SMART, type: smart, filter: ".*PRM.*", uselightgbm: true, collectdata: false, include-all: true, policy-priority: "Max:0.5;TOP:0.5;", prefer-asn: true}
  # 香港地区
  - {name: HKG, type: smart, filter: "(?=.*(香港|HK|Hong Kong|HKG))(?=.*PRM).*", uselightgbm: true, collectdata: false, include-all: true, policy-priority: "Max:0.5;TOP:0.3;PRO:0.3;", prefer-asn: true}
  # HOME
  - {name: HOME, type: smart, filter: "(?=.*(HOME|家宽|家庭|住宅)).*", uselightgbm: true, collectdata: false, include-all: true}
  # 新加坡地区
  - {name: SGP, type: smart, filter: '^(?=.*(新加坡|SG|Singapore|SGP))(?=.*PRM).*$', uselightgbm: true, collectdata: false, include-all: true, policy-priority: "Max:0.5;TOP:0.3;", prefer-asn: true}
  # 日本地区
  - {name: JPN, type: smart, filter: '^(?=.*(日本|东京|JP|Japan|JPN))(?=.*PRM).*$', uselightgbm: true, collectdata: false, include-all: true, policy-priority: "Max:0.5;TOP:0.3;", prefer-asn: true}
  # 美国地区
  - {name: USA, type: smart, filter: '^(?=.*(美国|纽约|洛杉矶|US|USA|United States|America))(?=.*PRM).*$', uselightgbm: true, collectdata: false, include-all: true, policy-priority: "Max:0.5;TOP:0.3;", prefer-asn: true}
  # 新加坡香港BSC混合节点组
  - {name: HK-Basic, type: smart, uselightgbm: true, collectdata: false, include-all: true, filter: "(?=.*(香港|HK|Hong Kong|HKG))(?=.*BSC).*", prefer-asn: true}
  - {name: SG-Basic, type: smart, uselightgbm: true, collectdata: false, include-all: true, filter: "(?=.*(新加坡|SG|Singapore|SGP))(?=.*BSC).*", policy-priority: LXY:1.2, prefer-asn: true}
  - {name: Other-Basic, type: smart, uselightgbm: true, collectdata: false, include-all: true, filter: "(?=.*(TWN|KOR|DEU|FRA|GBR|BRA|NLD))(?=.*BSC).*", prefer-asn: true}
  # 手动选择
  - {name: Manual Choice, type: select, filter: ^((?!(拒绝|直连)).)*$, include-all: true}
  #低倍率
  - {name: Download, type: smart, uselightgbm: true, collectdata: false, include-all: true, filter: "(?i)(下载|0\\.1|0\\.01X|BT|DL)", prefer-asn: true}


