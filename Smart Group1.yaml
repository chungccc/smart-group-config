#PRM节点组
#以下地区的分组只筛选了PRM优质机场的节点
#香港地区 
- name: HKG
  type: smart
  filter: "(?=.*(香港|HK|Hong Kong|HKG))(?=.*PRM).*" 
  uselightgbm: true
  collectdata: false
  include-all: true
  policy-priority: "PRO:0.5;Max:0.5;STB:0.5" #可自行根据机场的关键字前缀等设置权重 
  prefer-asn: true

#新加坡地区
- name: SGP
  type: smart
  filter: '^(?=.*(新加坡|SG|Singapore|SGP))(?=.*PRM).*$'
  uselightgbm: true
  collectdata: false
  include-all: true
  policy-priority: "PRO:0.5;Max:0.7;STB:0.5"
  prefer-asn: true


#美国地区
- name: USA
  type: smart
  filter: '(?i)^(?=.*(美国|America|USA|(^|[^A-Z])US([^A-Z]|$)))(?=.*PRM).*$'
  uselightgbm: true
  collectdata: false
  include-all: true
  policy-priority: "PRO:0.5;Max:0.7;STB:0.5"
  prefer-asn: true



#日本地区
- name: JPN
  type: smart
  filter: '^(?=.*(日本|东京|JP|Japan|JPN))(?=.*PRM).*$'
  uselightgbm: true
  collectdata: false
  include-all: true
  policy-priority: "PRO:0.5;Max:0.7;STB:0.5"
  prefer-asn: true


#台湾地区
- name: TWN
  type: smart
  filter: '^(?=.*(台湾|TW|TWN))(?=.*PRM).*$'
  include-all: true
  uselightgbm: true
  collectdata: false
  policy-priority: "PRO:0.5;Max:0.7;STB:0.5"
  prefer-asn: true

#BSC备用节点组 
- name: HK-Basic #Emby节点
  type: smart
  uselightgbm: true
  collectdata: false
  include-all: true
  filter: "(?=.*(香港|HK|Hong Kong|HKG))(?=.*BSC).*"
  policy-priority: "KIT:0.5;STB:0.9"
  prefer-asn: true

- name: SG-Basic #Emby节点
  type: smart
  uselightgbm: true
  collectdata: false
  include-all: true
  filter: "(?=.*(新加坡|SG|Singapore|SGP))(?=.*BSC).*"
  policy-priority: "KIT:0.5;STB:0.9"
  prefer-asn: true

- name: JP-Basic 
  type: smart
  uselightgbm: true
  collectdata: false
  include-all: true
  filter: "(?=.*(日本|JP|Japan|JPN))(?=.*BSC).*"
  policy-priority: "KIT:0.5;STB:0.7"
  prefer-asn: true


- name: Media Mix #YouTube影音节点 优质和备用的混合组 可以根据自己要使用的地址更改filter
  type: smart
  uselightgbm: true
  collectdata: false
  include-all: true
  filter: "(?=.*(香港|HK|Hong Kong|HKG))(?=.*(PRM|BSC)).*"
  policy-priority: "BSC:1.1;Max:0.5;Home:0.5"
  prefer-asn: true

#其他
- filter: ^((?!(拒绝|直连)).)*$
  include-all: true
  name: Manual Choice
  type: select

- name: Download #下载节点组
  type: smart
  uselightgbm: true
  collectdata: false
  include-all: true
  filter: "(?i)(下载|0\\.1|0\\.01X|BT|DL)"
  prefer-asn: true


