# ============================================
# Smart Engine 配置说明 v1.0
# 更新日期：2026-05-01
# ============================================

# 一、配置简介
# 本配置基于 Mihomo
# 采用 Smart 智能策略组与 LightGBM 模型
# 实现多机场自动选优，减少手动切换节点

# 二、核心特性
# 1. Smart 智能选路（type: smart）
#    根据延迟、稳定性、成功率自动选择最优节点

# 2. LightGBM 模型
#    自动学习节点表现，支持定期更新（默认48小时）

# 3. 多机场融合
#    -PRM：优质机场（主用）
#    -BSC：备用机场（容灾/补充）

# 4. 节点命名标准化
#    自动统一地区、运营商及特性标识（如 HK / JP / SG / US）

# 5. 精细化分流
#    内置常见策略组：ChatGPT、YouTube、Netflix、Telegram、Steam 等

# 6. DNS 优化
#    使用 Fake-IP 模式，配合国内外分流与加密 DNS fallback

# 三、使用说明
# 1. 填写各 proxy-providers 的订阅地址
# 2. 建议至少使用两个机场以发挥 Smart 优势
# 3. 节点名称需包含地区关键字（如 HK、JP、SG、US）
# 4. 支持 Clash Meta、OpenClash、Stash

# 四、注意事项
# 1. 单机场使用效果有限
# 2. 不建议关闭 LightGBM（会降低智能程度）
# 3. Smart 策略依赖节点质量，低质量节点会影响体验

# 五、特殊策略组说明
# Media Mix  ：影音场景（优质+备用混合）
# Download   ：下载专用（BT/低倍率节点优先）
# Manual     ：手动节点选择

# 六、补充说明
# 1. 关于 DNS
#    本配置未针对 DNS 泄露进行特殊优化，属于有意取舍，
#    更侧重整体性能与稳定性。如对 DNS 隐私有要求，请自行调整。

# 2. 使用环境
#    作者使用设备为 R68S，运行环境为 OpenClash，
#    其他设备或客户端可能需根据实际情况进行适配。

# 3. 配置来源
#    本配置在制作过程中参考并借鉴了多位社区作者与公开配置，
#    在此一并致谢。

# 4. 核心架构
#    本配置为完全基于 Smart 策略构建的方案，
#    依赖智能调度进行节点选择，不依赖传统 url-test / fallback 逻辑。

# 5. 使用建议
#    强烈建议合并使用多个机场订阅，以提升 Smart 策略的效果与稳定性，
#    单一机场无法发挥完整优势。

# 七、总结
# 本配置为一套自动化程度较高的智能代理方案，
# 适用于多机场用户进行日常使用与流媒体场景
# ============================================
proxy-providers:
  优质机场A:
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      lazy: true
      interval: 300
      timeout: 3000
    interval: 3600
    path: ./providers/专线.yaml
    type: http
    url: 机场订阅地址
    filter: '^(?!.*(流量|到期|套餐|官网|刷新|订阅|更新|失联|邮箱|IPV6|官方)).*$' #排除掉无效的节点 可自行添加关键字
    override:
      additional-prefix: "PRO-" #节点前缀 可用于区分机场
      additional-suffix: "-PRM" #节点后缀  可用于区分优质或者备用机场
      proxy-name: #以下为机场节点关键字替换 更新订阅后也会生效 可以在下面增加或者删减
       - pattern: "香港" #原节点里的关键字
         target: "HKG-" #替换为
       - pattern: "韩国"
         target: "KOR"
       - pattern: "马来西亚"
         target: "MYS"

 
  备用机场B:
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      lazy: true
      interval: 300
      timeout: 3000
    interval: 3600
    path: ./providers/一分.yaml
    type: http
    url: 机场订阅地址
    filter: '^(?!.*(流量|到期|套餐|官网|官方|推荐|刷新|订阅|更新|失联|CN|重置|个人|频道|Network|说明)).*$'
    override:
      additional-prefix: "ONE-" #节点前缀 
      additional-suffix: "-BSC" #节点后缀
      proxy-name: #以下为机场节点关键字替换 更新订阅后也会生效 如果不需要可以将以下部分删除
       - pattern: "香港" #原节点里的关键字
         target: "HKG-" #替换为
       - pattern: "韩国"
         target: "KOR"
       - pattern: "马来西亚"
         target: "MYS" 
  
  备用机场C:
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      lazy: true
      interval: 300
      timeout: 3000
    interval: 3600
    path: ./providers/LXY.yaml
    type: http
    url: 机场订阅地址
    filter: '^(?!.*(流量|到期|套餐|官网|官方|推荐|刷新|订阅|更新|失联|CN|重置|个人|频道|Network|说明)).*$'
    override:
      additional-prefix: "LXY-" #节点前缀 
      additional-suffix: "-BSC" #节点后缀
      proxy-name: #以下为机场节点关键字替换 更新订阅后也会生效 如果不需要可以将以下部分删除
       - pattern: "香港" #原节点里的关键字
         target: "HKG-" #替换为
       - pattern: "韩国"
         target: "KOR"
       - pattern: "马来西亚"
         target: "MYS"        
