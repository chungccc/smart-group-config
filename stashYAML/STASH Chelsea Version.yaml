proxy-providers:
  abc:
    filter: "^(?!.*Max).*(HK|SG|JP)"
    interval: 10800
    url: 
  hxy:
    filter: "香港|新加坡|日本|美国|台湾"
    interval: 10800
    url: 
proxy-groups:
  - icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
    lazy: true
    name: General
    proxies:
      - HKG
      - SGP
      - JPN
      - USA
      - AUTO
    type: fallback
  - name: TikTok
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok_1.png
    type: select
    proxies:
      - SGP
      - JPN
      - USA
  - name: ChatGPT
    icon: https://github.com/shindgewongxj/WHATSINStabc/raw/main/icon/openai.png
    type: select
    proxies:
      - SGP
      - JPN
      - USA
  - icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
    lazy: true
    name: AUTO
    tolerance: 50
    type: url-test
    proxies:
      - HKG
      - SGP
      - JPN
      - USA
  - filter: 香港|HK
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    lazy: true
    name: HKG
    type: url-test
    use:
      - hxy
      - abc
  - name: SGP
    filter: 新加坡|SG
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Singapore.png
    interval: 120
    lazy: true
    tolerance: 50
    type: url-test
    use:
      - hxy
      - abc
  - name: JPN
    filter: JP|日本
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Japan.png
    interval: 120
    lazy: true
    tolerance: 30
    type: url-test
    use:
      - hxy
      - abc
  - filter: 美国|US
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    name: USA
    type: url-test
    use:
      - hxy
      - abc
