proxy-providers: #机场订阅
  airportA:
    filter: "^(?!.*(流量|到期|套餐|官网|刷新|订阅|更新|失联|邮箱|IPV6|官方)).*$" #排除无效节点可自行添加
    interval: 10800
    url: #删除本注释填写订阅链接
proxy-groups:
  #节点分组
  - icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
    lazy: true
    name: General
    proxies:
      - HKG
      - SGP
      - JPN
    type: select
 
  - name: tiktok
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok_1.png
    type: select
    proxies:
      - SGP
      - JPN
  
  - name: openai
    icon: https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/openai.png
    type: select
    proxies:
      - SGP
      - JPN
      - DIRECT
  
  - name: Emby
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
    type: select
    proxies:
      - SGP
      - JPN
      - DIRECT
 #地区分组
  - filter: ".*(香港|香港🇭🇰|🇭🇰|HK|HKG|Hong Kong).*"
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    lazy: true
    name: HKG
    type: url-test
    interval: 120
    tolerance: 50
    use:
      - airportA
  - name: SGP
    filter: "(新加坡|新加坡🇸🇬|🇸🇬|SG|SGP|Singapore)"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Singapore.png
    interval: 120
    lazy: true
    tolerance: 50
    type: url-test
    include-all: null
    use:
      - airportA
  - name: USA
    filter: ".*(美国|美国🇺🇸|🇺🇸|US|USA|United States|United States of America).*"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/United_States.png
    interval: 120
    lazy: true
    tolerance: 30
    type: url-test
    include-all: null
    use:
    - airportA
  - name: JPN
    filter: ".*(日本|日本🇯🇵|🇯🇵|JP|JPN|Japan).*"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Japan.png
    interval: 120
    lazy: true
    tolerance: 30
    type: url-test
    include-all: null
    use:
      - airportA
  - name: 广告拦截
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AdBlack.png
    type: select
    proxies:
      - DIRECT
      - REJECT
rule-providers:
  anti-ad:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    url: https://anti-ad.net/clash.yaml
  秋风广告拦截:
    behavior: domain
    format: yaml
    interval: 0
    url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.yaml
rules:
  - RULE-SET,秋风广告拦截,广告拦截
  - GEOSITE,twitter,General
  - GEOSITE,Google,General #google
  - SCRIPT,quic,REJECT
  # Emby规则
  - DOMAIN-SUFFIX,poly.Emby.moe,Emby
  - DOMAIN-SUFFIX,link00.okemby.org,Emby 
  - DOMAIN-SUFFIX,link01.okemby.org,Emby 
  #ip检测
  - DOMAIN-SUFFIX,ip.sb,General
  - DOMAIN-SUFFIX,ipwho.is,General
  - DOMAIN-SUFFIX,ipapi.is,General
  - DOMAIN-SUFFIX,ip.skk.moe,General
  - DOMAIN-SUFFIX,iplark.com,General
  # Netflix
  - GEOSITE,netflix,General
  # Disney+
  - GEOSITE,disney,General
  # Spotify
  - GEOSITE,spotify,General
  # Speedtest
  - GEOSITE,speedtest,General
  # GitHub
  - GEOSITE,github,General
  # Telegram
  - IP-ASN,62014,General,no-resolve
  - IP-ASN,59930,General,no-resolve
  - IP-ASN,44907,General,no-resolve
  - IP-ASN,211157,General,no-resolve
  - PROCESS-NAME,Telegram.exe,General
  - PROCESS-NAME,Telegram,General
  - GEOSITE,telegram,General
  # YouTube
  - GEOSITE,youtube,General
  # Twitter
  - GEOSITE,twitter,General
  - DOMAIN-SUFFIX,tapbots.com,General
  # Instagram
  - GEOSITE,instagram,General
  # openai
  - GEOSITE,openai,openai
  # Facebook
  - GEOSITE,facebook,General
  # tiktok
  - GEOSITE,tiktok,tiktok
  # Steam
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,steam,General
  # Apple LBS
  - DOMAIN-SUFFIX,iphone-ld.apple.com,DIRECT
  - DOMAIN-SUFFIX,lcdn-locator.apple.com,DIRECT
  - DOMAIN-SUFFIX,lcdn-registration.apple.com,DIRECT
  - DOMAIN-SUFFIX,push.apple.com,DIRECT
  # Apple OCSP
  - PROCESS-NAME,trustd,General
  # Microsoft
  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,microsoft,General
  - GEOSITE,xbox,General
  # common proxy utils
  - PROCESS-NAME,v2ray,DIRECT
  - PROCESS-NAME,Surge,DIRECT
  - PROCESS-NAME,ss-local,DIRECT
  - PROCESS-NAME,privoxy,DIRECT
  - PROCESS-NAME,trojan,DIRECT
  - PROCESS-NAME,trojan-go,DIRECT
  - PROCESS-NAME,naive,DIRECT
  - PROCESS-NAME,CloudflareWARP,DIRECT
  - PROCESS-NAME,Cloudflare WARP,DIRECT
  - IP-CIDR,162.159.193.0/24,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,General
script:
  shortcuts:
    quic: network == 'udp' and dst_port == 443
dns:
  default-nameserver:
    - 114.114.115.115
    - 119.28.28.28
    - 223.6.6.6
    - system
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - https://1.12.12.12/dns-query
    - https://120.53.53.53/dns-query
  follow-rule: null
log-level: silent
mode: rule
